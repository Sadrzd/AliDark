plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alidark.module'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alidark.module'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // LSPosed supports the legacy Xposed API. compileOnly keeps the API out of the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}
