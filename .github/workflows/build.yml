name: Build AliDark

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and Extract Source ZIP
        run: |
          echo "=== 检查仓库根目录文件 ==="
          ls -la
          
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "未找到 .zip 压缩包，检查是否已解压..."
          else
            echo "找到压缩包: $ZIP_FILE，正在解压..."
            unzip -q -o "$ZIP_FILE"
          fi
          
          echo "=== 解压后的目录层级 ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Project and Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "❌ 错误: 未能在压缩包或仓库中找到 settings.gradle！"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "✅ 找到 Android 工程根目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f "gradlew" ]; then
            echo "未找到 gradlew，正在初始化 gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          echo "🚀 开始编译 APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AliDark-APK
          path: |
            **/build/outputs/apk/**/*.apk
