name: Build AliDark

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and Extract Source ZIP
        run: |
          echo "=== 检查仓库根目录文件 ==="
          ls -la
          
          # 寻找源码 zip 压缩包
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "未找到 .zip 源码包，直接检查是否为已解压工程..."
          else
            echo "找到压缩包: $ZIP_FILE，正在解压..."
            unzip -q -o "$ZIP_FILE"
          fi
          
          echo "=== 解压后的目录层级 ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Project and Build APK
        run: |
          # 寻找 settings.gradle 或 settings.gradle.kts 所在目录
          SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "❌ 错误: 未能在压缩包或仓库中找到 settings.gradle，请检查源码包结构！"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "✅ 找到 Android 工程根目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f "gradlew" ]; then
            echo "未找到 gradlew 包装器，正在初始化 gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          echo "🚀 开始编译 Release APK..."
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AliDark-APK
          path: |
            **/build/outputs/apk/**/*.apk

