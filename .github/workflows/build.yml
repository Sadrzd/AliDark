name: Build AliDark

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and Extract Source ZIP
        run: |
          echo "=== 检查仓库根目录文件 ==="
          ls -la
          
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "解压源码包: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Code and Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "✅ 工程目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "🔧 自动修复 build.gradle 中的 VERSION_8"
          find . -name "build.gradle" -exec sed -i 's/VERSION_8/VERSION_1_8/g' {} +
          
          echo "=== 根目录 build.gradle 内容 ==="
          cat build.gradle 2>/dev/null || true
          
          echo "=== app/build.gradle 内容 ==="
          cat app/build.gradle 2>/dev/null || true
          
          echo "🔧 生成 Gradle 8.5 Wrapper..."
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          
          echo "🚀 开始编译 APK..."
          ./gradlew assembleDebug

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AliDark-APK
          path: |
            **/build/outputs/apk/**/*.apk
