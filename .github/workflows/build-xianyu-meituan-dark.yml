name: Build XianyuMeituanDark

on:
  push:
    branches: [ main, master ]
    paths:
      - 'XianyuMeituanDark/**'
      - '.github/workflows/build-xianyu-meituan-dark.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release APK
        working-directory: XianyuMeituanDark
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianyuMeituanDark-Release-APK
          path: XianyuMeituanDark/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XianyuMeituanDark/app/build/outputs/apk/release/*.apk
          generate_release_notes: true