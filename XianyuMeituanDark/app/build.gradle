plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xmdark.module'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xmdark.module'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/release.keystore')
            storePassword 'XMDark@2026release'
            keyAlias 'xmdark'
            keyPassword 'XMDark@2026release'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // No R8 shrinking: XMDarkHook is referenced only from assets/xposed_init
            // and must keep its class/method names intact.
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // LSPosed exposes the legacy Xposed API. compileOnly keeps it out of the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}